<header class="navbar-shell">
  <nav class="navbar" aria-label="Navigation principale">
    <div class="navbar-left">
      <button
        class="menu-button"
        type="button"
        aria-label="Ouvrir le menu"
        [attr.aria-expanded]="menuOpen"
        aria-controls="main-menu"
        (click)="toggleMenu()"
      >
        <span class="menu-icon" aria-hidden="true">
          <i></i>
          <i></i>
          <i></i>
        </span>
        <span class="menu-label">Menu</span>
      </button>

      <a
        class="instagram-button"
        href="https://www.instagram.com/lachapetrie/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Suivre La Chapétrie sur Instagram"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="5"></rect>
          <circle cx="12" cy="12" r="4"></circle>
          <circle cx="17.5" cy="6.5" r="1"></circle>
        </svg>
      </a>
    </div>

    <a class="brand" routerLink="/" (click)="closeMenu()">La Chapétrie</a>

    <a
      class="cart-button"
      routerLink="/panier"
      aria-label="Voir le panier"
      (click)="closeMenu()"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path
          d="M3 4h2l2.2 10.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 1.9-1.5L20 8H7"
        ></path>
        <circle cx="10" cy="20" r="1"></circle>
        <circle cx="17" cy="20" r="1"></circle>
      </svg>
      @if (cartItemCount > 0) {
        <span class="cart-count">{{ cartItemCount }}</span>
      }
    </a>

    <div id="main-menu" class="dropdown-menu" [class.open]="menuOpen">
      <span class="dropdown-kicker">Explorer</span>
      <a routerLink="/" fragment="shop" (click)="closeMenu()">
        <span>01</span>
        Boutique
      </a>
      <a routerLink="/" fragment="nouveautes" (click)="closeMenu()">
        <span>02</span>
        Nouveauté
      </a>
      <a routerLink="/" fragment="coup-de-coeur" (click)="closeMenu()">
        <span>03</span>
        Coup de Cœur
      </a>
      @if (isAuthenticated) {
        <a class="admin-link" routerLink="/admin" (click)="closeMenu()">
          <span>04</span>
          Accéder au back office
        </a>
      }
    </div>
  </nav>
</header>
